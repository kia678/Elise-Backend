name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建平台，例如 linux/amd64 或 linux/amd64,linux/arm64"
        required: false
        default: "linux/amd64"
      push:
        description: "构建完成后推送到镜像仓库"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORMS="${{ inputs.platforms }}"
            PUSH="${{ inputs.push }}"
          else
            PLATFORMS="linux/amd64"
            PUSH="true"
          fi
          if [ -z "$PLATFORMS" ]; then PLATFORMS="linux/amd64"; fi
          echo "platforms=$PLATFORMS" >> "$GITHUB_ENV"
          echo "push=$PUSH" >> "$GITHUB_ENV"

      - name: Prepare image metadata
        id: meta
        run: |
          set -e
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          SHORT_SHA=$(git rev-parse --short HEAD)
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/$OWNER_LC/elise:latest"
          TAGS="$TAGS"$'\n'"ghcr.io/$OWNER_LC/elise:v$VERSION"
          TAGS="$TAGS"$'\n'"ghcr.io/$OWNER_LC/elise:sha-$SHORT_SHA"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="$TAGS"$'\n'"docker.io/$DOCKERHUB_USERNAME/elise:latest"
            TAGS="$TAGS"$'\n'"docker.io/$DOCKERHUB_USERNAME/elise:v$VERSION"
          fi
          {
            echo "tags<<EOF_TAGS"
            echo "$TAGS"
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.push == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.platforms }}
          push: ${{ env.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=elise
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Docker image build"
            echo ""
            echo "- platforms: \`${{ env.platforms }}\`"
            echo "- pushed: \`${{ env.push }}\`"
            echo "- version: \`${{ steps.meta.outputs.version }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
